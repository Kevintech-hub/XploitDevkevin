<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEXPLOIT • Pair Code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --void:#0B1220;
    --panel:#121B2E;
    --panel-2:#0E1729;
    --line:rgba(148,180,214,0.12);
    --line-strong:rgba(148,180,214,0.3);
    --signal:#5EEAD4;
    --signal-soft:rgba(94,234,212,0.12);
    --pulse:#FB7185;
    --pulse-soft:rgba(251,113,133,0.12);
    --ink:#EAF2FB;
    --dim:#8496AD;
    --dim-2:#4B5A70;
  }
  html{width:100%;min-height:100%;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 75% 55% at 50% 38%, #000 35%, transparent 100%);
    mask-image:radial-gradient(ellipse 75% 55% at 50% 38%, #000 35%, transparent 100%);
    z-index:0; pointer-events:none;
  }
  .sweep{
    position:fixed; top:38%; left:50%; width:900px; height:900px;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg, transparent 0deg, var(--signal-soft) 8deg, transparent 40deg, transparent 360deg);
    animation:sweep 9s linear infinite;
    z-index:0; pointer-events:none;
    border-radius:50%;
  }
  @keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg);}}
  .ring{position:fixed; top:38%; left:50%; border:1px solid var(--line); border-radius:50%; transform:translate(-50%,-50%); z-index:0; pointer-events:none;}
  .ring-1{animation:ringPulse 4.5s ease-out infinite;}
  .ring-2{animation:ringPulse 4.5s ease-out infinite 1.5s;}
  .ring-3{animation:ringPulse 4.5s ease-out infinite 3s;}
  @keyframes ringPulse{0%{width:80px;height:80px;opacity:0.45;}100%{width:820px;height:820px;opacity:0;}}
  @keyframes breathe{0%,100%{opacity:1;}50%{opacity:0.3;}}
  @keyframes blink{50%{opacity:0;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media (prefers-reduced-motion: reduce){
    .sweep,.ring-1,.ring-2,.ring-3,.led,.cursor{animation:none !important;}
  }

  .page{position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; width:100%; max-width:560px; padding:clamp(40px,8vh,72px) clamp(18px,4vw,32px);}

  .status-line{display:flex; align-items:center; gap:9px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:2.5px; text-transform:uppercase; color:var(--dim); margin-bottom:30px;}
  .led{width:7px;height:7px;border-radius:50%; background:var(--signal); box-shadow:0 0 7px var(--signal); animation:breathe 2.1s ease-in-out infinite; flex-shrink:0; transition:background 0.3s, box-shadow 0.3s;}

  .wordmark{font-size:clamp(2.2rem,8vw,3rem); font-weight:700; letter-spacing:0.5px; color:var(--ink);}
  .cursor{display:inline-block; width:0.5em; height:0.72em; background:var(--signal); margin-left:5px; animation:blink 1.1s step-end infinite; vertical-align:-0.06em;}
  .wordmark-rule{width:100%; max-width:200px; height:1px; background:linear-gradient(90deg,var(--signal),transparent); margin:14px 0 10px;}
  .tagline{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:4px; text-transform:uppercase; color:var(--dim-2); margin-bottom:40px;}

  .console{position:relative; background:var(--panel); border:1px solid var(--line-strong); width:100%;}
  .console.locked .corner{opacity:1; box-shadow:0 0 7px var(--signal);}
  .corner{position:absolute;width:14px;height:14px;border-color:var(--signal);border-style:solid;opacity:0.6;transition:opacity 0.3s, box-shadow 0.3s;}
  .corner-tl{top:-1px;left:-1px;border-width:2px 0 0 2px;}
  .corner-tr{top:-1px;right:-1px;border-width:2px 2px 0 0;}
  .corner-bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px;}
  .corner-br{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}

  .console-main{width:100%; padding:32px 26px;}
  .console-title{font-size:16px; font-weight:600; margin-bottom:6px;}
  .console-hint{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--dim); line-height:1.6; margin-bottom:24px;}

  .field-row{display:flex; gap:10px;}
  .field{position:relative; flex:1;}
  .field-prefix{position:absolute; left:13px; top:50%; transform:translateY(-50%); font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--signal); pointer-events:none;}
  .field input{
    width:100%; background:var(--panel-2); border:1px solid var(--line-strong); border-radius:4px;
    padding:13px 13px 13px 30px; font-family:'IBM Plex Mono',monospace; font-size:14px; color:var(--ink);
    outline:none; transition:border-color 0.2s, box-shadow 0.2s;
  }
  .field input::placeholder{color:var(--dim-2);}
  .field input:focus{border-color:var(--signal); box-shadow:0 0 0 3px var(--signal-soft);}
  .field input.error{border-color:var(--pulse); box-shadow:0 0 0 3px var(--pulse-soft);}
  .field input::-webkit-outer-spin-button, .field input::-webkit-inner-spin-button{-webkit-appearance:none;}

  .btn-primary{
    padding:13px 20px; background:var(--signal); border:1px solid var(--signal); border-radius:4px; color:var(--void);
    font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; letter-spacing:1px; text-transform:uppercase;
    cursor:pointer; white-space:nowrap; flex-shrink:0; transition:filter 0.2s, transform 0.15s;
  }
  .btn-primary:hover:not(:disabled){filter:brightness(1.1);}
  .btn-primary:active:not(:disabled){transform:scale(0.97);}
  .btn-primary:disabled{opacity:0.4; cursor:not-allowed;}
  .btn-primary:focus-visible{outline:2px solid var(--ink); outline-offset:2px;}

  .msg{margin-top:16px; font-family:'IBM Plex Mono',monospace; font-size:12px; display:flex; align-items:center; gap:8px;}
  .msg.error{color:var(--pulse);}
  .msg.loading{color:var(--dim);}
  .spinner{width:13px;height:13px;border:2px solid var(--line-strong);border-top-color:var(--signal);border-radius:50%;animation:spin 0.7s linear infinite;flex-shrink:0;}

  .result{margin-top:22px; background:var(--panel-2); border:1px solid var(--signal); border-radius:4px; padding:22px; text-align:center;}
  .result-label{font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:3px; text-transform:uppercase; color:var(--dim); margin-bottom:12px;}
  .result-code{font-family:'IBM Plex Mono',monospace; font-size:clamp(20px,6vw,28px); letter-spacing:5px; color:var(--signal); margin-bottom:16px; word-break:break-all;}
  .btn-copy{
    display:inline-flex; align-items:center; gap:7px; padding:8px 18px; background:transparent; border:1px solid var(--line-strong);
    border-radius:100px; color:var(--dim); font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:1.5px;
    text-transform:uppercase; cursor:pointer; transition:all 0.2s;
  }
  .btn-copy:hover{border-color:var(--signal); color:var(--signal);}
  .btn-copy.copied{border-color:var(--signal); color:var(--signal); background:var(--signal-soft);}
  .btn-copy:focus-visible{outline:2px solid var(--signal); outline-offset:2px;}

  .back{margin-top:36px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--dim-2); text-decoration:none; transition:color 0.2s;}
  .back:hover{color:var(--dim);}
  .back:focus-visible{outline:2px solid var(--signal); outline-offset:3px;}

  @media(max-width:460px){
    .field-row{flex-direction:column;}
    .btn-primary{width:100%; padding:13px;}
    .console-main{padding:26px 20px;}
  }
</style>
</head>
<body>

<div class="ring ring-1"></div><div class="ring ring-2"></div><div class="ring ring-3"></div>
<div class="sweep"></div>

<div class="page">
  <div class="status-line"><span class="led" id="led"></span><span id="statusText">AWAITING INPUT</span></div>

  <div class="wordmark">JEXPLOIT<span class="cursor"></span></div>
  <div class="wordmark-rule"></div>
  <div class="tagline">Pairing Console</div>

  <div class="console" id="consoleFrame">
    <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
    <span class="corner corner-bl"></span><span class="corner corner-br"></span>
    <div class="console-main">
      <div class="console-title">Link your device</div>
      <div class="console-hint">Enter your phone number with country code (no + or spaces)</div>

      <div class="field-row">
        <div class="field">
          <span class="field-prefix">+</span>
          <input type="number" id="number" placeholder="254759XXXXXX" autocomplete="tel">
        </div>
        <button class="btn-primary" id="submit">Get Code</button>
      </div>

      <div id="msgArea"></div>
      <div id="resultArea"></div>
    </div>
  </div>

  <a class="back" href="/">← Back to console</a>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.0.0-alpha.1/axios.min.js"></script>
<script>
  const numInput = document.getElementById('number');
  const submitBtn = document.getElementById('submit');
  const msgArea = document.getElementById('msgArea');
  const resultArea = document.getElementById('resultArea');
  const statusText = document.getElementById('statusText');
  const led = document.getElementById('led');
  const consoleFrame = document.getElementById('consoleFrame');

  function setMsg(text, type){
    if(!text){ msgArea.innerHTML=''; return; }
    const icon = type==='loading' ? '<span class="spinner"></span>' : type==='error' ? '✕' : '';
    msgArea.innerHTML = `<div class="msg ${type}">${icon}<span>${text}</span></div>`;
  }

  function setStatus(text, mode){
    statusText.textContent = text;
    led.style.background = mode==='error' ? 'var(--pulse)' : 'var(--signal)';
    led.style.boxShadow = mode==='error' ? '0 0 7px var(--pulse)' : '0 0 7px var(--signal)';
  }

  function showCode(code){
    resultArea.innerHTML = `
      <div class="result">
        <div class="result-label">Pair Code</div>
        <div class="result-code" id="codeVal">${code}</div>
        <button class="btn-copy" id="copyBtn">Copy Code</button>
      </div>`;
    consoleFrame.classList.add('locked');
    document.getElementById('copyBtn').addEventListener('click', async () => {
      const btn = document.getElementById('copyBtn');
      const val = document.getElementById('codeVal').innerText;
      try{
        await navigator.clipboard.writeText(val);
        btn.classList.add('copied');
        btn.textContent = '✓ Copied';
        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = 'Copy Code'; }, 2000);
      }catch(e){}
    });
  }

  submitBtn.addEventListener('click', async () => {
    const raw = numInput.value.replace(/[^0-9]/g, '');
    resultArea.innerHTML = '';
    consoleFrame.classList.remove('locked');

    if(!raw){
      numInput.classList.add('error');
      setMsg('Phone number is required', 'error');
      setStatus('INPUT REQUIRED', 'error');
      return;
    }
    if(raw.length < 10){
      numInput.classList.add('error');
      setMsg('Invalid number — include country code', 'error');
      setStatus('INPUT REQUIRED', 'error');
      return;
    }

    numInput.classList.remove('error');
    submitBtn.disabled = true;
    setMsg('Requesting pair code…', 'loading');
    setStatus('REQUESTING', 'ok');

    try{
      const { data } = await axios(`/code?number=${raw}`);
      const code = data.code || 'Service Unavailable';
      setMsg('');
      showCode(code);
      setStatus('CODE ACQUIRED', 'ok');
    }catch(err){
      setMsg('Failed to get pair code. Try again.', 'error');
      setStatus('REQUEST FAILED', 'error');
    }finally{
      submitBtn.disabled = false;
    }
  });

  numInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') submitBtn.click(); });
  numInput.addEventListener('input', () => numInput.classList.remove('error'));
</script>
</body>
</html>
