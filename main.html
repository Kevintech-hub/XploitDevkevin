<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEXPLOIT • Pairing Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --void:#0B1220;
    --panel:#121B2E;
    --panel-2:#0E1729;
    --line:rgba(148,180,214,0.12);
    --line-strong:rgba(148,180,214,0.3);
    --signal:#5EEAD4;
    --signal-soft:rgba(94,234,212,0.12);
    --pulse:#FB7185;
    --pulse-soft:rgba(251,113,133,0.12);
    --ink:#EAF2FB;
    --dim:#8496AD;
    --dim-2:#4B5A70;
  }
  html{width:100%;min-height:100%;}
  body{
    background:var(--void);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow-x:hidden;
  }
  body::before{
    content:'';
    position:fixed; inset:0;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:46px 46px;
    -webkit-mask-image:radial-gradient(ellipse 75% 55% at 50% 38%, #000 35%, transparent 100%);
    mask-image:radial-gradient(ellipse 75% 55% at 50% 38%, #000 35%, transparent 100%);
    z-index:0; pointer-events:none;
  }
  .sweep{
    position:fixed; top:38%; left:50%; width:900px; height:900px;
    transform:translate(-50%,-50%);
    background:conic-gradient(from 0deg, transparent 0deg, var(--signal-soft) 8deg, transparent 40deg, transparent 360deg);
    animation:sweep 9s linear infinite;
    z-index:0; pointer-events:none;
    border-radius:50%;
  }
  @keyframes sweep{to{transform:translate(-50%,-50%) rotate(360deg);}}
  .ring{
    position:fixed; top:38%; left:50%;
    border:1px solid var(--line);
    border-radius:50%;
    transform:translate(-50%,-50%);
    z-index:0; pointer-events:none;
  }
  .ring-1{animation:ringPulse 4.5s ease-out infinite;}
  .ring-2{animation:ringPulse 4.5s ease-out infinite 1.5s;}
  .ring-3{animation:ringPulse 4.5s ease-out infinite 3s;}
  @keyframes ringPulse{
    0%{width:80px;height:80px;opacity:0.45;}
    100%{width:820px;height:820px;opacity:0;}
  }
  @keyframes breathe{0%,100%{opacity:1;}50%{opacity:0.3;}}
  @keyframes blink{50%{opacity:0;}}
  @media (prefers-reduced-motion: reduce){
    .sweep,.ring-1,.ring-2,.ring-3,.led,.cursor{animation:none !important;}
  }

  .page{
    position:relative; z-index:2;
    display:flex; flex-direction:column; align-items:center;
    width:100%; max-width:640px;
    padding:clamp(40px,8vh,72px) clamp(18px,4vw,32px);
  }

  .status-line{
    display:flex; align-items:center; gap:9px;
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:2.5px; text-transform:uppercase;
    color:var(--dim);
    margin-bottom:30px;
  }
  .led{
    width:7px;height:7px;border-radius:50%;
    background:var(--signal); box-shadow:0 0 7px var(--signal);
    animation:breathe 2.1s ease-in-out infinite;
    flex-shrink:0;
  }

  .wordmark{
    font-size:clamp(2.4rem,9vw,3.6rem);
    font-weight:700;
    letter-spacing:0.5px;
    color:var(--ink);
  }
  .cursor{
    display:inline-block; width:0.5em; height:0.72em;
    background:var(--signal);
    margin-left:5px;
    animation:blink 1.1s step-end infinite;
    vertical-align:-0.06em;
  }
  .wordmark-rule{
    width:100%; max-width:220px; height:1px;
    background:linear-gradient(90deg,var(--signal),transparent);
    margin:16px 0 10px;
  }
  .tagline{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; letter-spacing:4px; text-transform:uppercase;
    color:var(--dim-2);
    margin-bottom:44px;
  }

  .methods{
    display:grid; grid-template-columns:1fr 1fr; gap:14px;
    width:100%;
  }

  .console{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line-strong);
  }
  .console.locked .corner{opacity:1; box-shadow:0 0 7px var(--signal);}
  .corner{position:absolute;width:14px;height:14px;border-color:var(--signal);border-style:solid;opacity:0.6;transition:opacity 0.3s, box-shadow 0.3s;}
  .corner-tl{top:-1px;left:-1px;border-width:2px 0 0 2px;}
  .corner-tr{top:-1px;right:-1px;border-width:2px 2px 0 0;}
  .corner-bl{bottom:-1px;left:-1px;border-width:0 0 2px 2px;}
  .corner-br{bottom:-1px;right:-1px;border-width:0 2px 2px 0;}

  .method{
    display:flex; flex-direction:column; align-items:flex-start; gap:14px;
    padding:26px 20px; text-decoration:none; color:inherit; cursor:pointer;
    transition:background 0.25s, border-color 0.25s, transform 0.2s;
  }
  .method:hover{background:var(--panel-2); border-color:var(--signal);}
  .method:hover .corner{opacity:1; box-shadow:0 0 6px var(--signal);}
  .method:active{transform:scale(0.98);}
  .method:focus-visible{outline:2px solid var(--signal); outline-offset:3px;}

  .method-mark{
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; color:var(--signal); letter-spacing:1.5px; text-transform:uppercase;
  }
  .method-title{font-size:17px; font-weight:600;}
  .method-desc{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--dim); line-height:1.6;
  }
  .method-go{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px; color:var(--dim-2); letter-spacing:1px;
    display:flex; align-items:center; gap:5px;
  }
  .method:hover .method-go{color:var(--signal);}

  .footer{
    margin-top:48px;
    font-family:'IBM Plex Mono',monospace;
    font-size:10.5px; letter-spacing:1.5px; text-transform:uppercase;
    color:var(--dim-2);
  }

  @media (max-width:480px){
    .methods{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<div class="ring ring-1"></div>
<div class="ring ring-2"></div>
<div class="ring ring-3"></div>
<div class="sweep"></div>

<div class="page">
  <div class="status-line"><span class="led"></span>SYSTEM READY</div>

  <div class="wordmark">JEXPLOIT<span class="cursor"></span></div>
  <div class="wordmark-rule"></div>
  <div class="tagline">Pairing Console</div>

  <div class="methods">
    <a class="console method" href="javascript:void(0)" onclick="window.open('/qrpage')">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <div class="method-mark">Via Camera</div>
      <div class="method-title">QR Code</div>
      <div class="method-desc">Scan to link<br>your device</div>
      <div class="method-go">CONNECT →</div>
    </a>

    <a class="console method" href="javascript:void(0)" onclick="window.open('/pair')">
      <span class="corner corner-tl"></span><span class="corner corner-tr"></span>
      <span class="corner corner-bl"></span><span class="corner corner-br"></span>
      <div class="method-mark">Via Number</div>
      <div class="method-title">Pair Code</div>
      <div class="method-desc">Link via<br>phone number</div>
      <div class="method-go">CONNECT →</div>
    </a>
  </div>

  <div class="footer">Built by Kevin Tech</div>
</div>

</body>
</html>
